name: Sync Task Backlog to GitHub Milestones & Issues

on:
  workflow_dispatch:
    inputs:
      member_a_github:
        description: 'GitHub Username của Member A (Trưởng nhóm)'
        required: false
        type: string
      member_b_github:
        description: 'GitHub Username của Member B (Nghiệp vụ)'
        required: false
        type: string
      member_c_github:
        description: 'GitHub Username của Member C (Giao diện & Báo cáo)'
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - docs/tasks/**.md

permissions:
  contents: read
  issues: write

jobs:
  sync-backlog:
    name: Sync Milestones, Labels & Issues
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Execute Sync Script
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MEMBER_A_GITHUB: ${{ inputs.member_a_github || vars.MEMBER_A_GITHUB || '' }}
          MEMBER_B_GITHUB: ${{ inputs.member_b_github || vars.MEMBER_B_GITHUB || '' }}
          MEMBER_C_GITHUB: ${{ inputs.member_c_github || vars.MEMBER_C_GITHUB || '' }}
        run: node .github/scripts/sync-issues.js
