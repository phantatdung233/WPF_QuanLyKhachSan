name: Sync Task Backlog to GitHub Milestones & Issues

on:
  workflow_dispatch:
    inputs:
      member_a_github:
        description: 'GitHub Username của Member A (Trưởng nhóm)'
        required: false
        type: string
      member_b_github:
        description: 'GitHub Username của Member B (Nghiệp vụ)'
        required: false
        type: string
      member_c_github:
        description: 'GitHub Username của Member C (Giao diện & Báo cáo)'
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - TASKS.md

permissions:
  contents: read
  issues: write

jobs:
  sync-backlog:
    name: Sync Milestones, Labels & Issues
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Parse TASKS.md to Structured JSON
        id: parse_tasks
        run: |
          node -e '
          const fs = require("fs");
          const content = fs.readFileSync("TASKS.md", "utf8");
          const lines = content.split(/\r?\n/);

          const tasks = [];
          let currentTask = null;
          let collectingDoD = false;

          for (let i = 0; i < lines.length; i++) {
            const line = lines[i];

            // Match task header: ### [TASK-01] Title
            const headerMatch = line.match(/^###\s+\[(TASK-\d+)\]\s+(.+)$/);
            if (headerMatch) {
              if (currentTask) {
                tasks.push(currentTask);
              }
              currentTask = {
                id: headerMatch[1].trim(),
                title: `[${headerMatch[1].trim()}] ${headerMatch[2].trim()}`,
                assignee: "",
                priority: "Medium",
                labels: [],
                branch: "",
                milestone: "",
                dod: []
              };
              collectingDoD = false;
              continue;
            }

            if (!currentTask) continue;

            const assigneeMatch = line.match(/^- \*\*Assignee\*\*:\s*(.+)$/i);
            if (assigneeMatch) {
              currentTask.assignee = assigneeMatch[1].trim();
              continue;
            }

            const priorityMatch = line.match(/^- \*\*Priority\*\*:\s*(.+)$/i);
            if (priorityMatch) {
              currentTask.priority = priorityMatch[1].trim();
              continue;
            }

            const labelsMatch = line.match(/^- \*\*Labels\*\*:\s*(.+)$/i);
            if (labelsMatch) {
              currentTask.labels = labelsMatch[1].split(",").map(l => l.replace(/[`\s]/g, "")).filter(Boolean);
              continue;
            }

            const branchMatch = line.match(/^- \*\*Branch\*\*:\s*`?([^`\r\n]+)`?/i);
            if (branchMatch) {
              currentTask.branch = branchMatch[1].trim();
              continue;
            }

            const milestoneMatch = line.match(/^- \*\*Milestone\*\*:\s*(.+)$/i);
            if (milestoneMatch) {
              currentTask.milestone = milestoneMatch[1].trim();
              continue;
            }

            if (line.match(/^- \*\*Definition of Done\*\*:/i)) {
              collectingDoD = true;
              continue;
            }

            if (collectingDoD) {
              if (line.trim().startsWith("- [ ]") || line.trim().startsWith("- [x]")) {
                currentTask.dod.push(line.trim());
              } else if (line.startsWith("---") || line.startsWith("###")) {
                collectingDoD = false;
              }
            }
          }

          if (currentTask) {
            tasks.push(currentTask);
          }

          fs.writeFileSync("parsed_tasks.json", JSON.stringify(tasks, null, 2));
          console.log(`Đã trích xuất thành công ${tasks.length} tasks từ TASKS.md`);
          '

      - name: Create Milestones and Standard Labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== 1. TẠO 3 MILESTONES THEO BAREM ĐỒ ÁN ==="
          MILESTONES=(
            "Mốc 1: Module Độc Lập (Tuần 1-3)"
            "Mốc 2: Ghép Luồng E2E & Nâng Cao (Tuần 4-5)"
            "Mốc 3: Chốt Demo & Feature Freeze (Tuần 6)"
          )

          EXISTING_MILESTONES=$(gh api repos/$GITHUB_REPOSITORY/milestones --jq '.[].title' || echo "")

          for m in "${MILESTONES[@]}"; do
            if echo "$EXISTING_MILESTONES" | grep -F -x -q "$m"; then
              echo "✓ Milestone đã tồn tại: $m"
            else
              echo "+ Tạo mới Milestone: $m"
              gh api repos/$GITHUB_REPOSITORY/milestones -f title="$m" > /dev/null
            fi
          done

          echo "=== 2. TẠO BỘ LABELS MÀU CHUẨN ==="
          declare -A LABELS=(
            ["core"]="0052cc"
            ["architecture"]="1d76db"
            ["database"]="0e8a16"
            ["navigation"]="5319e7"
            ["auth"]="d93f0b"
            ["security"]="b60205"
            ["room"]="fbca04"
            ["customer"]="1f883d"
            ["service"]="bfd4f2"
            ["booking"]="e99695"
            ["business-logic"]="d4c5f9"
            ["workflow"]="c5def5"
            ["invoice"]="0e8a16"
            ["billing"]="2cbe4e"
            ["ui"]="f9d0c4"
            ["theme"]="e36209"
            ["layout"]="cfd3d7"
            ["advanced"]="b60205"
            ["room-map"]="d93f0b"
            ["stats"]="6f42c1"
            ["chart"]="5319e7"
            ["performance"]="d4c5f9"
            ["async"]="006b75"
            ["integration"]="1d76db"
            ["e2e-testing"]="0366d6"
            ["refactor"]="fbca04"
            ["clean-code"]="2cbe4e"
            ["qa"]="d93f0b"
            ["bugfix"]="d73a4a"
            ["hardening"]="b60205"
            ["docs"]="0075ca"
            ["presentation"]="a2eeef"
            ["demo"]="7057ff"
            ["devops"]="000000"
            ["git"]="f34f29"
            ["seed-data"]="bfdadc"
            ["priority-high"]="b60205"
            ["priority-medium"]="fbca04"
            ["priority-low"]="0e8a16"
            ["m1"]="1d76db"
            ["m2"]="5319e7"
            ["m3"]="6f42c1"
          )

          EXISTING_LABELS=$(gh label list --limit 100 --json name --jq '.[].name' || echo "")

          for label in "${!LABELS[@]}"; do
            color="${LABELS[$label]}"
            if echo "$EXISTING_LABELS" | grep -F -x -q "$label"; then
              gh label edit "$label" --color "$color" > /dev/null 2>&1 || true
            else
              gh label create "$label" --color "$color" > /dev/null 2>&1 || true
            fi
          done
          echo "✓ Hoàn thành khởi tạo Labels."

      - name: Create GitHub Issues via GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MEMBER_A: ${{ inputs.member_a_github || vars.MEMBER_A_GITHUB || '' }}
          MEMBER_B: ${{ inputs.member_b_github || vars.MEMBER_B_GITHUB || '' }}
          MEMBER_C: ${{ inputs.member_c_github || vars.MEMBER_C_GITHUB || '' }}
        run: |
          echo "=== 3. TỰ ĐỘNG ĐẨY ISSUES TỪ PARSED TASKS QUA GH CLI ==="
          node -e '
          const fs = require("fs");
          const { execSync } = require("child_process");

          const tasks = JSON.parse(fs.readFileSync("parsed_tasks.json", "utf8"));
          const memberA = process.env.MEMBER_A || "";
          const memberB = process.env.MEMBER_B || "";
          const memberC = process.env.MEMBER_C || "";

          // Lấy danh sách Issues đã tồn tại để tránh tạo trùng lặp
          let existingIssueTitles = [];
          try {
            const raw = execSync("gh issue list --state all --limit 200 --json title", { encoding: "utf8" });
            existingIssueTitles = JSON.parse(raw).map(i => i.title);
          } catch (e) {
            console.warn("Không thể lấy danh sách issue hiện có:", e.message);
          }

          for (const task of tasks) {
            if (existingIssueTitles.some(t => t.startsWith(`[${task.id}]`))) {
              console.log(`[SKIP] Issue ${task.id} đã tồn tại trên repo.`);
              continue;
            }

            // Xác định Assignee thật nếu có mapping
            let assigneeUsername = "";
            if (task.assignee.includes("Member A") && memberA) assigneeUsername = memberA;
            else if (task.assignee.includes("Member B") && memberB) assigneeUsername = memberB;
            else if (task.assignee.includes("Member C") && memberC) assigneeUsername = memberC;

            // Xây dựng nội dung Body chuẩn
            let body = `### Phân Công Nhiệm Vụ\n`;
            body += `- **Mã Task**: \`${task.id}\`\n`;
            body += `- **Thành viên đảm nhiệm**: **${task.assignee}**${assigneeUsername ? ` (@${assigneeUsername})` : ""}\n`;
            body += `- **Mức độ ưu tiên**: \`${task.priority}\`\n`;
            body += `- **Nhánh làm việc gợi ý**: \`${task.branch}\`\n`;
            body += `- **Milestone**: ${task.milestone}\n\n`;
            body += `### Definition of Done (Checklist Hoàn Thành)\n`;
            if (task.dod.length > 0) {
              body += task.dod.join("\n") + "\n\n";
            } else {
              body += `- [ ] Hoàn thành toàn bộ chức năng theo kế hoạch đề ra.\n\n`;
            }
            body += `---\n*Tự động khởi tạo từ \`TASKS.md\` qua GitHub Actions.*`;

            // Chuẩn bị tham số gh issue create
            const labelArgs = [...task.labels];
            if (task.priority) labelArgs.push(`priority-${task.priority.toLowerCase()}`);

            let cmd = `gh issue create --title ${JSON.stringify(task.title)} --body ${JSON.stringify(body)}`;
            
            for (const lbl of labelArgs) {
              cmd += ` --label ${JSON.stringify(lbl)}`;
            }

            if (task.milestone) {
              cmd += ` --milestone ${JSON.stringify(task.milestone)}`;
            }

            if (assigneeUsername) {
              cmd += ` --assignee ${JSON.stringify(assigneeUsername)}`;
            }

            try {
              console.log(`+ Đang tạo Issue: ${task.title}...`);
              const res = execSync(cmd, { encoding: "utf8" });
              console.log(`  -> Tạo thành công: ${res.trim()}`);
            } catch (err) {
              // Fallback nếu gán assignee lỗi (user chưa accept invite hoặc sai tên)
              if (assigneeUsername && err.message.includes("assignee")) {
                console.warn(`  ! Thử lại không gán assignee cho ${task.title}...`);
                const fallbackCmd = cmd.replace(/--assignee [^\s]+/, "");
                execSync(fallbackCmd, { encoding: "utf8" });
              } else {
                console.error(`  x Lỗi tạo issue ${task.title}:`, err.message);
              }
            }
          }
          console.log("✓ Hoàn thành đồng bộ toàn bộ Tasks lên GitHub Issues!");
          '
